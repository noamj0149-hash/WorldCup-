<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorldCup Bracket</title><style>body{margin:0;font-family:Arial;background:#07111f;color:white}header{position:sticky;top:0;background:#07111f;padding:12px;border-bottom:1px solid #263856}.nav{display:flex;gap:6px;overflow:auto}.nav button{border:0;border-radius:20px;padding:9px 12px;background:#182943;color:white;font-weight:bold}.nav .on{background:#38d982;color:#041408}main{padding:12px}.card{background:#101d32;border:1px solid #263856;border-radius:14px;padding:12px;margin:10px 0}.team{display:flex;justify-content:space-between;align-items:center;background:#0b1526;border:1px solid #263856;border-radius:10px;padding:8px;margin:6px 0}.rank button,.big,select{border:1px solid #2d4165;background:#1b2d4a;color:white;border-radius:8px;padding:7px 9px;font-weight:bold}.rank .sel,.good{background:#38d982!important;color:#041408!important}.big{width:100%;margin-top:8px}.grid{display:grid;grid-template-columns:1fr;gap:10px}.match{background:#0b1526;border:1px solid #263856;border-radius:12px;padding:10px;margin:8px 0}.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;text-align:center}.side{background:#121f35;border:1px solid #243653;border-radius:10px;padding:8px;min-height:40px;display:flex;align-items:center;justify-content:center;font-weight:bold}select{width:100%;margin-top:8px}.warn{background:#33270d;color:#ffe8a3}.photo{background:white;color:#111;border-radius:14px;padding:12px}.box{border:1px solid #ddd;border-radius:10px;padding:8px;margin:7px 0}@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><header><h2>מונדיאל 2026 - בראקט</h2><div class="nav"><button id="b_groups" class="on" onclick="tab('groups')">בתים</button><button id="b_thirds" onclick="tab('thirds')">מקומות 3</button><button id="b_ko" onclick="tab('ko')">נוקאאוט</button><button id="b_photo" onclick="tab('photo')">תמונה</button></div></header><main><section id="groups"><div class="card">בחר 1,2,3 בכל בית. נשמר בטלפון.<button class="big" onclick="resetAll()">איפוס</button></div><div id="groupsBox" class="grid"></div></section><section id="thirds" style="display:none"><div class="card">בחר בדיוק 8 בתים שעלו מהמקום השלישי. אחרי זה השיבוץ נעשה אוטומטית לפי התאמה חוקית לפי סלוטים של פיפ״א.<div id="thirdBox"></div></div></section><section id="ko" style="display:none"><div id="koBox"></div></section><section id="photo" style="display:none"><div id="photoBox" class="photo"></div></section></main><script>
const groups={A:["מקסיקו","דרום אפריקה","צ׳כיה","דרום קוריאה"],B:["קנדה","בוסניה והרצגובינה","קטאר","שווייץ"],C:["ברזיל","מרוקו","סקוטלנד","האיטי"],D:["ארצות הברית","פרגוואי","טורקיה","אוסטרליה"],E:["גרמניה","קוראסאו","חוף השנהב","אקוודור"],F:["הולנד","יפן","שוודיה","תוניסיה"],G:["מצרים","איראן","בלגיה","ניו זילנד"],H:["ספרד","קייפ ורדה","ערב הסעודית","אורוגוואי"],I:["צרפת","נורווגיה","סנגל","עיראק"],J:["ארגנטינה","אוסטריה","ירדן","אלג׳יריה"],K:["פורטוגל","קונגו DR","אוזבקיסטן","קולומביה"],L:["אנגליה","קרואטיה","גאנה","פנמה"]};
const slots=[["T74","1E",["A","B","C","D","F"]],["T77","1I",["C","D","F","G","H"]],["T79","1A",["C","E","F","H","I"]],["T80","1L",["E","H","I","J","K"]],["T81","1D",["B","E","F","I","J"]],["T82","1G",["A","E","H","I","J"]],["T85","1B",["E","F","G","I","J"]],["T87","1K",["D","E","I","J","L"]]];
const r1=[["73","2A","2B"],["74","1E","T74"],["75","1F","2C"],["76","1C","2F"],["77","1I","T77"],["78","2E","2I"],["79","1A","T79"],["80","1L","T80"],["81","1D","T81"],["82","1G","T82"],["83","2K","2L"],["84","1H","2J"],["85","1B","T85"],["86","1J","2H"],["87","1K","T87"],["88","2D","2G"]];
const later=[["89","W73","W75"],["90","W74","W77"],["91","W76","W78"],["92","W79","W80"],["93","W83","W84"],["94","W81","W82"],["95","W86","W88"],["96","W85","W87"],["97","W89","W90"],["98","W93","W94"],["99","W91","W92"],["100","W95","W96"],["101","W97","W98"],["102","W99","W100"],["104","W101","W102"]];
let S=JSON.parse(localStorage.wc26auto||'{"rank":{},"third":[],"slot":{},"win":{}}');function save(){localStorage.wc26auto=JSON.stringify(S)}
function tab(id){["groups","thirds","ko","photo"].forEach(x=>{document.getElementById(x).style.display=x==id?"block":"none";document.getElementById("b_"+x).classList.toggle("on",x==id)});if(id=="thirds")renderThirds();if(id=="ko"){autoSlots();renderKO()}if(id=="photo")renderPhoto()}
function renderGroups(){let h="";for(const [g,ts] of Object.entries(groups)){h+=`<div class=card><b>בית ${g}</b>`;for(const t of ts){let r=S.rank[g+"|"+t]||"";h+=`<div class=team><span>${t}</span><span class=rank>${[1,2,3].map(n=>`<button class="${r==n?'sel':''}" onclick='rank("${g}",${JSON.stringify(t)},${n})'>${n}</button>`).join("")}</span></div>`}h+="</div>"}groupsBox.innerHTML=h}function rank(g,t,n){for(const x of groups[g])if(S.rank[g+"|"+x]==n)delete S.rank[g+"|"+x];S.rank[g+"|"+t]=n;save();renderGroups()}
function byRank(g,n){return groups[g].find(t=>S.rank[g+"|"+t]==n)||`${n}${g}`}function thirdTeam(g){return byRank(g,3)}
function renderThirds(){let h="";for(const g of Object.keys(groups)){let on=S.third.includes(g);h+=`<button class="big ${on?'good':''}" onclick="tog('${g}')">בית ${g}: ${thirdTeam(g)} ${on?'✓':''}</button>`}h+=`<p>נבחרו ${S.third.length}/8</p>`;thirdBox.innerHTML=h}function tog(g){if(S.third.includes(g))S.third=S.third.filter(x=>x!=g);else if(S.third.length<8)S.third.push(g);S.slot={};save();renderThirds()}
function autoSlots(){S.slot={};let chosen=[...S.third];function back(i,used){if(i==slots.length)return true;let [id,opp,allowed]=slots[i];for(const g of chosen){if(!used.has(g)&&allowed.includes(g)){S.slot[id]=g;used.add(g);if(back(i+1,used))return true;used.delete(g);delete S.slot[id]}}return false}back(0,new Set());save()}
function res(c){if(c[0]=="1"||c[0]=="2")return byRank(c[1],+c[0]);if(c[0]=="W")return S.win[c.slice(1)]||null;if(c[0]=="T"){let g=S.slot[c];return g?thirdTeam(g):null}return c}function lab(c){if(c[0]=="1")return "מנצחת בית "+c[1];if(c[0]=="2")return "מקום שני בית "+c[1];if(c[0]=="W")return "מנצחת משחק "+c.slice(1);return "מקום שלישי"}
function box(c){return `<div class=side>${res(c)||lab(c)}</div>`}function match(m){let opts=[res(m[1]),res(m[2])].filter(Boolean),w=S.win[m[0]]||"";return `<div class=match><small>משחק ${m[0]}</small><div class=vs>${box(m[1])}<span>נגד</span>${box(m[2])}</div><select onchange="S.win['${m[0]}']=this.value;save();renderKO()"><option value="">בחר מנצחת</option>${opts.map(o=>`<option ${w==o?'selected':''}>${o}</option>`).join("")}</select></div>`}
function renderKO(){let h="";if(S.third.length!=8)h+="<div class='card warn'>צריך לבחור בדיוק 8 מקומות שלישיים.</div>";if(Object.keys(S.slot).length<8)h+="<div class='card warn'>השיבוץ לא הושלם אוטומטית. בדוק בחירת מקומות שלישיים.</div>";h+=`<div class=card><h3>Round of 32</h3><div class=grid>${r1.map(match).join("")}</div></div><div class=card><h3>המשך עד הגמר</h3><div class=grid>${later.map(match).join("")}</div></div>`;koBox.innerHTML=h}
function renderPhoto(){autoSlots();let h="<h2>הבראקט שלי</h2>";for(const g of Object.keys(groups))h+=`<div class=box><b>בית ${g}</b><br>1. ${byRank(g,1)}<br>2. ${byRank(g,2)}<br>3. ${thirdTeam(g)}</div>`;h+="<h3>נוקאאוט</h3>";for(const m of [...r1,...later])h+=`<div class=box>${res(m[1])||lab(m[1])} נגד ${res(m[2])||lab(m[2])}<br>מנצחת: ${S.win[m[0]]||"לא נבחר"}</div>`;photoBox.innerHTML=h}
function resetAll(){S={rank:{},third:[],slot:{},win:{}};save();renderGroups()}renderGroups();
</script></body></html>
